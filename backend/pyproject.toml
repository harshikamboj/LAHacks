[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "tradeops-reconciler"
version = "0.1.0"
description = "Synthetic settlement reconciliation with durable MongoDB case memory"
requires-python = ">=3.12"
dependencies = [
  "pymongo[srv]>=4.11,<5",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "httpx>=0.28,<1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-dotenv>=1.0,<2",  # simulators load the repo .env without the app Settings
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app", "simulators"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["atlas: opt-in tests using real Atlas and uniquely identified synthetic test records"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
